spring.application.name=bicavi

# Em desenvolvimento, lê as variáveis do arquivo .env (se existir).
# O caminho é relativo à pasta de onde a aplicação foi iniciada:
#   - terminal em backend/         -> .env
#   - IntelliJ na raiz do projeto  -> backend/.env
# Em produção nenhum dos dois existe: as variáveis vêm do ambiente do servidor.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# DB_HOST: "localhost" em dev; no Docker de produção é o serviço "db" do compose.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O schema é responsabilidade do Flyway (src/main/resources/db/migration).
# O Hibernate apenas confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: o segredo assina os tokens. Vazou = qualquer um gera tokens válidos.
bicavi.jwt.secret=${JWT_SECRET}
bicavi.jwt.expiration=${JWT_EXPIRATION:24h}

# Limite de tentativas de login por e-mail (contra força bruta; ver LoginRateLimiter).
# 5 tentativas seguidas; depois, 1 nova a cada 3 minutos.
bicavi.login-limit.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
bicavi.login-limit.refill-every=${LOGIN_REFILL_EVERY:3m}
