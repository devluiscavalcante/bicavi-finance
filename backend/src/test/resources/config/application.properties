# Carregado APENAS nos testes, por cima do application.properties principal
# (o Spring Boot lê classpath:/application.properties e depois classpath:/config/).
# Este segredo não protege nada real: existe só para os testes não dependerem do .env.
bicavi.jwt.secret=segredo-falso-usado-somente-nos-testes-automatizados

# Os testes de integração cadastram e logam vários usuários no mesmo contexto
# Spring (compartilhado entre as classes): os limites globais de produção
# barrariam os testes a partir do 6º cadastro. Os limites em si são testados
# em AuthRateLimiterTest, com relógio controlado.
bicavi.auth-limit.login-global.max-attempts=1000
bicavi.auth-limit.register.max-attempts=1000
