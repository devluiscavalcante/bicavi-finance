# Bicavi em produção: banco + backend + nginx (frontend).
#   docker compose up -d --build     sobe/atualiza tudo
#   docker compose logs -f backend   acompanha os logs
#   docker compose down              para (os dados ficam no volume db-data)
#
# As variáveis vêm do arquivo .env NESTA pasta (não versionado; ver .env.example).
# O compose de desenvolvimento (só o Postgres) continua em backend/compose.yaml,
# com outro volume: dados reais e dados de teste nunca se misturam.
name: bicavi

services:
  db:
    # Tag, e não digest: o "compose pull db" traz as correções do Postgres 17.x
    # (ver DEPLOY.md, seção 8).
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Sem "ports": o banco só é acessível pela rede "data", ou seja, só pelo backend.
    networks: [data]
    mem_limit: 512m
    pids_limit: 200
    # Sem cap_drop nem read_only: ao subir, o Postgres ajusta dono e permissões
    # da pasta de dados (precisa desses poderes) e grava dados por natureza.
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # $$ = "$" literal: a variável é lida DENTRO do container, não pelo compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      # O backend NÃO usa o administrador do banco (DB_USER, superusuário):
      # entra com um usuário comum, dono só das tabelas do Bicavi
      # (criado por scripts/create-app-role.ps1). Se o backend for invadido,
      # o estrago fica nos dados do app: sem rodar comandos no container,
      # ler arquivos ou criar outros usuários no Postgres.
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks: [app, data]
    # A JVM usa até 75% disto (MaxRAMPercentage no Dockerfile).
    mem_limit: 768m
    pids_limit: 200
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m  # o Tomcat embutido e a JVM usam o /tmp
    # Só sobe quando o Postgres estiver aceitando conexões (senão o Flyway falha).
    depends_on:
      db:
        condition: service_healthy
    # Pronto = porta 8080 aceitando conexão. O Spring só abre a porta depois de
    # subir tudo (inclusive as migrations do Flyway), então não precisa do Actuator.
    # start_period: tempo de subida da JVM, em que as falhas ainda não contam.
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build: ./frontend
    restart: unless-stopped
    # 127.0.0.1: acessível só NESTE computador (nem a rede local alcança).
    # Quem expõe para os iPhones, com HTTPS, é o Tailscale (ver DEPLOY.md).
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    networks: [edge, app]
    mem_limit: 64m
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m  # pid e arquivos temporários do nginx sem root
    # Espera o backend ficar pronto: sem isso, as primeiras chamadas a /api
    # logo depois de um "up" davam 502 enquanto as migrations rodavam.
    depends_on:
      backend:
        condition: service_healthy

# Cada container só enxerga quem precisa:
#
#   edge (com internet)       app (interna)            data (interna)
#   Tailscale ──► web ─────────────► backend ─────────────► db
#
# - edge: só o nginx. Existe porque o Docker não publica porta (a 8088) de
#   container ligado apenas a redes internas.
# - app: nginx e backend. O nginx alcança o backend, e só ele.
# - data: backend e banco. O nginx não alcança o banco.
# internal: true = sem saída para a internet. O backend e o banco não chamam
# nada de fora; se um deles fosse invadido, o invasor não conseguiria baixar
# ferramentas nem mandar os dados para fora por aqui.
networks:
  edge: {}
  app:
    internal: true
  data:
    internal: true

# mem_limit / pids_limit (em cada serviço): teto de memória e de processos.
# Um vazamento de memória ou um abuso (ex.: criar processos sem parar) derruba
# só aquele container, que o "restart" sobe de novo, e não o PC inteiro.
# Juntos, os três usam no máximo ~1,3 GB.
#
# Se um container for invadido, o invasor fica com o mínimo de poder:
# - no-new-privileges: nenhum processo ganha mais privilégio do que já tem
#   (ex.: por um programa com setuid).
# - cap_drop: [ALL]: tira os "pedaços de root" que o Docker dá por padrão
#   (trocar dono de arquivo, abrir porta baixa...). O nginx e o backend rodam
#   como usuário comum e não precisam de nenhum.
# - read_only: o sistema de arquivos do container não aceita escrita (o
#   invasor não altera o próprio app); só o /tmp, em memória (tmpfs), é gravável.

volumes:
  db-data:
