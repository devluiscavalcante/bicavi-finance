# nginx em produção: serve o app (build do Vite) e repassa /api para o backend.
# Faz o papel que o proxy do Vite faz em dev: para o navegador, app e API ficam
# na MESMA origem, então não há CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Não anuncia a versão do nginx nas respostas de erro.
    server_tokens off;

    # A lista padrão de tipos do nginx não conhece .webmanifest e mandaria
    # "application/octet-stream"; o navegador espera este tipo para o manifest do PWA.
    include mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Cabeçalhos de segurança para todas as respostas.
    # (add_header dentro de um location anularia estes; por isso os locations
    # abaixo usam "expires" para cache, que não interfere.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy: diz ao navegador de onde a página pode carregar
    # scripts, estilos, fontes, imagens e para onde pode fazer requisições.
    # É a principal defesa contra XSS: mesmo que um texto malicioso virasse
    # <script> na página, o navegador recusaria rodá-lo (não veio de um arquivo
    # do próprio app). Importa aqui porque o token de login fica no localStorage.
    #   default-src 'self'      tudo só do próprio app, salvo o que vem abaixo
    #                           (inclui fetch para /api, fonte, service worker)
    #   object-src 'none'       nada de plugins (<object>, <embed>)
    #   base-uri 'self'         impede trocar a base dos links com <base>
    #   form-action 'self'      formulários só enviam para o próprio app
    #   frame-ancestors 'none'  ninguém exibe o app dentro de um <iframe>
    # Sem 'unsafe-inline': o build do Vite não tem script nem estilo inline.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # API: "backend" é o nome do serviço no compose (o Docker resolve o endereço).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Arquivos com hash no nome (index-BPs9lTr9.js): o conteúdo nunca muda para
    # o mesmo nome, então o navegador pode guardar por 1 ano.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Estes NUNCA podem ficar em cache: é por eles que o navegador descobre que
    # existe versão nova. Em cache, a atualização automática do PWA não chegaria.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        expires -1;
        try_files $uri =404;
    }

    # Rotas do react-router (/categorias, /login...) não são arquivos:
    # devolve o index.html e o React decide qual tela mostrar.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
